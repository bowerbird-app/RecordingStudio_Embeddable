test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# featured_in shape: credentials dig(:r2, :access_key_id|:secret_access_key|:endpoint|:bucket).
# Dummy reads the same key names from ENV (loaded from gitignored local_r2.yml /
# .env.development.local). Values stay out of the public repo.
r2:
  service: S3
  access_key_id: <%= ENV.fetch("R2_ACCESS_KEY_ID", nil).presence || ENV.fetch("ARTIFACT_CDN_R2_ACCESS_KEY_ID", nil) %>
  secret_access_key: <%= ENV.fetch("R2_SECRET_ACCESS_KEY", nil).presence || ENV.fetch("ARTIFACT_CDN_R2_SECRET_ACCESS_KEY", nil) %>
  endpoint: <%= ENV.fetch("R2_ENDPOINT", nil).presence || ENV.fetch("ARTIFACT_CDN_R2_ENDPOINT", nil) %>
  bucket: <%= ENV.fetch("R2_BUCKET", nil).presence || ENV.fetch("ARTIFACT_CDN_R2_BUCKET", nil) %>
  region: <%= ENV.fetch("R2_REGION", nil).presence || ENV.fetch("ARTIFACT_CDN_R2_REGION", nil).presence || "auto" %>
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
