test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# featured_in shape: Rails.application.credentials.dig(:r2, …)
# Development reads real values from credentials/development.yml.enc when the
# gitignored development.key is present. Absent credentials → blank ERB values;
# Active Storage stays on :local (see development.rb) unless DummyDevCredentials
# flips the service to :r2 after a successful dig.
r2:
  service: S3
  access_key_id: <%= DummyDevCredentials.dig(:r2, :access_key_id) %>
  secret_access_key: <%= DummyDevCredentials.dig(:r2, :secret_access_key) %>
  endpoint: <%= DummyDevCredentials.dig(:r2, :endpoint) %>
  bucket: <%= DummyDevCredentials.dig(:r2, :bucket) %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
