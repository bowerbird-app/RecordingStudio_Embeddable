AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_embeddable/hooks.rb'
    - 'lib/recording_studio_embeddable/configuration.rb'
    - 'app/controllers/recording_studio_embeddable/embeds_controller.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'app/controllers/recording_studio_embeddable/**/*'
    - 'app/jobs/recording_studio_embeddable/**/*'
    - 'app/models/recording_studio_embeddable/**/*'
    - 'lib/recording_studio_embeddable/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'app/controllers/recording_studio_embeddable/**/*'
    - 'app/models/recording_studio_embeddable/**/*'
    - 'lib/recording_studio_embeddable/**/*'

Metrics/BlockLength:
  Exclude:
    - 'db/migrate/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'app/controllers/recording_studio_embeddable/**/*'
    - 'app/models/recording_studio_embeddable/**/*'
    - 'lib/recording_studio_embeddable/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'app/controllers/recording_studio_embeddable/**/*'
    - 'app/models/recording_studio_embeddable/**/*'
    - 'lib/recording_studio_embeddable/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'app/controllers/recording_studio_embeddable/**/*'
    - 'app/jobs/recording_studio_embeddable/**/*'
    - 'lib/recording_studio_embeddable/services/**/*'

Naming/AccessorMethodName:
  Exclude:
    - 'app/controllers/recording_studio_embeddable/embeds_controller.rb'

Style/OptionalBooleanParameter:
  Exclude:
    - 'app/jobs/recording_studio_embeddable/**/*'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_embeddable/services/**/*'
    - 'test/services/**/*'
